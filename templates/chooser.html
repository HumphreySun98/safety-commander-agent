<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SafetyCommander</title>
<style>
  :root{--bg:#0b0e13;--panel:#141923;--line:#252d3b;--txt:#e6eaf0;--muted:#8a94a6;--accent:#7c5cff;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  h1{font-size:30px;margin:0} h1 .b{color:var(--accent)}
  .sub{color:var(--muted);margin-bottom:30px}
  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding:0 20px}
  a.card{width:300px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px 26px;text-decoration:none;color:var(--txt);transition:.15s;display:block}
  a.card:hover{border-color:var(--accent);transform:translateY(-3px)}
  .ic{font-size:42px} .ct{font-size:22px;font-weight:700;margin:12px 0 6px}
  .cd{color:var(--muted);font-size:14px;line-height:1.5}
  .foot{color:var(--muted);font-size:12px;margin-top:34px}
</style></head>
<body>
  <h1>🦺 Safety<span class="b">Commander</span></h1>
  <div class="sub">Autonomous safety officer · choose your view</div>
  <div class="cards">
    <a class="card" href="/worker">
      <div class="ic">👷</div>
      <div class="ct">员工端 · Floor</div>
      <div class="cd">现场状态、需要你注意的告警、你的整改任务、今日安全重点。</div>
    </a>
    <a class="card" href="/manager">
      <div class="ic">📊</div>
      <div class="ct">管理端 · Operations</div>
      <div class="cd">月度 KPI、违规趋势、未关闭整改 backlog、AI 周计划、实时监控大屏。</div>
    </a>
  </div>
  <div class="foot">VLM reasons risk from the policy · perception measures · RAG cites OSHA · actions auto-fire</div>
</body></html>
