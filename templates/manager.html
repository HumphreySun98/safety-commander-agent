<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SafetyCommander · Manager</title>
<link rel="stylesheet" href="/static/vendor/tabler.min.css"/>
<style>
  :root{--tblr-font-sans-serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .plan-pre{white-space:pre-wrap;font-size:13px;line-height:1.5;max-height:420px;overflow:auto;margin:0;color:var(--tblr-body-color);background:transparent;border:0}
</style>
</head>
<body data-bs-theme="dark">
<header class="navbar navbar-expand-md d-print-none sticky-top">
  <div class="container-xl">
    <h1 class="navbar-brand fs-3 mb-0">📊 SafetyCommander · <span data-i18n="manager_title">Manager · Operations</span></h1>
    <div class="navbar-nav flex-row order-md-last align-items-center" style="gap:12px">
      <span id="langsw"></span>
      <a class="btn btn-primary" href="/monitor" data-i18n="live_monitor">▶ Live monitor</a>
      <a class="nav-link" href="/" data-i18n="switch_view">switch view</a>
    </div>
  </div>
</header>
<div class="page-wrapper">
  <div class="page-body">
    <div class="container-xl">

      <div class="row row-deck row-cards mb-1" id="kpis"></div>

      <div class="row row-deck row-cards mt-1">
        <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title" data-i18n="panel_hazards">Top hazards</h3></div>
          <div class="card-body"><div id="chart-haz" style="min-height:220px"></div></div></div></div>
        <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title" data-i18n="panel_zone">By zone</h3></div>
          <div class="card-body"><div id="chart-zone" style="min-height:220px"></div></div></div></div>
      </div>

      <div class="row row-deck row-cards mt-1">
        <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title" data-i18n="panel_backlog">Open corrective-action backlog</h3></div>
          <div class="table-responsive" style="max-height:420px;overflow:auto"><table class="table table-vcenter card-table">
            <tbody id="ca"><tr><td class="text-secondary" data-i18n="loading">Loading…</td></tr></tbody></table></div></div></div>
        <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title" data-i18n="panel_plan">AI weekly plan</h3></div>
          <div class="card-body"><pre class="plan-pre" id="plan" data-i18n="loading">Loading…</pre></div></div></div>
      </div>

      <div class="row row-cards mt-1">
        <div class="col-12"><div class="card"><div class="card-header"><h3 class="card-title" data-i18n="panel_delivery">Alert delivery &amp; acknowledgment</h3></div>
          <div class="table-responsive" style="max-height:360px;overflow:auto"><table class="table table-vcenter card-table">
            <tbody id="deliv"><tr><td class="text-secondary" data-i18n="loading">Loading…</td></tr></tbody></table></div></div></div>
      </div>

    </div>
  </div>
</div>
<script src="/static/vendor/tabler.min.js"></script>
<script src="/static/vendor/apexcharts.min.js"></script>
<script src="/static/i18n.js"></script>
<script>
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function j(u){try{return await (await fetch(u)).json()}catch(e){return null}}
async function t(u){try{return await (await fetch(u)).text()}catch(e){return ''}}
let _k=null, _ca=null, _plan='', _deliv=null, hazChart=null, zoneChart=null;
const STCOLOR={unread:'bg-secondary',acknowledged:'bg-azure',resolved:'bg-green',escalated:'bg-orange'};

function barOpts(pairs, color){
  return {
    chart:{type:'bar',height:220,toolbar:{show:false},background:'transparent',fontFamily:'inherit'},
    theme:{mode:'dark'},
    plotOptions:{bar:{horizontal:true,borderRadius:4,barHeight:'62%'}},
    dataLabels:{enabled:false}, grid:{borderColor:'rgba(255,255,255,.06)'},
    colors:[color], series:[{name:'count',data:pairs.map(p=>p[1])}],
    xaxis:{categories:pairs.map(p=>p[0]),labels:{style:{colors:'#8a94a6'}}},
    yaxis:{labels:{style:{colors:'#cfd6e2'},maxWidth:200}},
    tooltip:{theme:'dark'}
  };
}
function drawChart(ref, elId, pairs, color){
  if(!pairs||!pairs.length){ document.getElementById(elId).innerHTML='<div class="text-secondary p-3">—</div>'; return ref; }
  if(ref){ ref.updateOptions({series:[{data:pairs.map(p=>p[1])}],xaxis:{categories:pairs.map(p=>p[0])}}); return ref; }
  const ch=new ApexCharts(document.getElementById(elId), barOpts(pairs,color)); ch.render(); return ch;
}
function render(){
  const T=window.T||(k=>k);
  if(_k){
    const rate=_k.observations? Math.round(_k.violations/_k.observations*100):0;
    const card=(n,label,cls='')=>`<div class="col-6 col-lg"><div class="card"><div class="card-body">
      <div class="subheader">${label}</div><div class="h1 mb-0 ${cls}">${n}</div></div></div></div>`;
    document.getElementById('kpis').innerHTML=
      card(_k.violations+` <span class="text-secondary fs-4">(${rate}%)</span>`, T('kpi_violations'))
      + card(_k.near_miss, T('kpi_nearmiss'), 'text-warning')
      + card(_k.critical, T('kpi_critical'), 'text-danger')
      + card((_k.open_correctives||[]).length, T('kpi_backlog'))
      + card(_k.observations, T('kpi_frames'));
    hazChart=drawChart(hazChart,'chart-haz', _k.by_hazard||[], '#7c5cff');
    zoneChart=drawChart(zoneChart,'chart-zone', _k.by_zone||[], '#22c55e');
  }
  document.getElementById('ca').innerHTML=(_ca&&_ca.length)? _ca.slice(0,14).map(c=>
    `<tr><td><span class="fw-bold">${esc(c.hazard)}</span><div class="text-secondary small">${esc(c.instruction)}</div></td></tr>`).join('')
    + (_ca.length>14?`<tr><td class="text-secondary">…+${_ca.length-14}</td></tr>`:'')
    : `<tr><td class="text-secondary">${T('none_open')}</td></tr>`;
  document.getElementById('plan').textContent=_plan || T('no_plan');
  document.getElementById('deliv').innerHTML=(_deliv&&_deliv.length)? _deliv.map(d=>{
    const c=C_LVL[d.level]||'#f97316';
    const recips=(d.to||[]).map(r=>`<span class="badge ${STCOLOR[r.state]||'bg-secondary'} me-1">${esc(r.worker)}: ${esc(r.state)}</span>`).join('');
    return `<tr><td style="white-space:nowrap" class="text-secondary small">${esc((d.ts||'').replace('T',' ').slice(11,16))}</td>
      <td><span class="badge" style="background:${c};color:#0b0e13">${esc(d.level).toUpperCase()}</span></td>
      <td class="fw-bold">${esc(d.hazard)}</td><td>${recips}</td></tr>`;
  }).join('') : `<tr><td class="text-secondary">${T('none_open')}</td></tr>`;
}
const C_LVL={none:'#6b7280',low:'#22c55e',medium:'#eab308',high:'#f97316',critical:'#ef4444'};
async function tick(){ _k=await j('/api/kpi'); _ca=await j('/api/correctives'); _plan=await t('/api/plan'); _deliv=await j('/api/deliveries'); render(); }
window.onLangChange=render;
setInterval(tick,4000); tick();
</script>
</body>
</html>
