<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SafetyCommander · Worker</title>
<link rel="stylesheet" href="/static/vendor/tabler.min.css"/>
<style>
  :root{--tblr-font-sans-serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .obs2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.4}
  .bot{width:26px;height:26px;border-radius:7px;background:#1b2230;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .sec-h{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--tblr-secondary);margin:18px 0 8px}
</style>
</head>
<body data-bs-theme="dark">
<header class="navbar navbar-expand-md sticky-top">
  <div class="container-xl">
    <h1 class="navbar-brand fs-3 mb-0">👷 SafetyCommander</h1>
    <div class="navbar-nav flex-row order-md-last align-items-center" style="gap:12px">
      <span class="text-secondary small" data-i18n="w_iam">I am</span>
      <select class="form-select form-select-sm" id="whoami" style="width:auto"></select>
      <span class="badge bg-red" id="unread" style="display:none"></span>
      <span id="langsw"></span>
      <a class="nav-link" href="/">← <span data-i18n="switch_view">switch view</span></a>
    </div>
  </div>
</header>
<div class="page-wrapper">
  <div class="page-body">
    <div class="container-xl" style="max-width:780px">
      <div class="sec-h" data-i18n="w_alerts">🔔 Safety alerts</div>
      <div id="alerts"><div class="text-secondary" data-i18n="loading">Loading…</div></div>
      <div class="sec-h" data-i18n="w_tasks">📋 My scheduled tasks</div>
      <div id="tasks"><div class="text-secondary" data-i18n="loading">Loading…</div></div>
    </div>
  </div>
</div>
<script src="/static/vendor/tabler.min.js"></script>
<script src="/static/i18n.js"></script>
<script>
const C={none:'#6b7280',low:'#22c55e',medium:'#eab308',high:'#f97316',critical:'#ef4444'};
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function j(u){try{return await (await fetch(u)).json()}catch(e){return null}}
let _data=null;
const who=()=>document.getElementById('whoami').value;

function alertCard(m){
  const T=window.T||(k=>k), c=C[m.level]||'#f97316', acted=m.mine_state!=='unread';
  const sl={acknowledged:T('w_acked'),resolved:T('w_resolved'),escalated:T('w_escalated')}[m.mine_state]||m.mine_state;
  const actions = acted
    ? `<span class="badge bg-secondary">✓ ${esc(sl)}</span>`
    : `<div class="btn-list">
         <button class="btn btn-sm btn-primary" onclick="act('${m.id}','acknowledged')">${T('w_ack')}</button>
         <button class="btn btn-sm btn-success" onclick="act('${m.id}','resolved')">${T('w_resolve')}</button>
         <button class="btn btn-sm btn-outline-warning" onclick="act('${m.id}','escalated')">${T('w_escalate')}</button>
       </div>`;
  return `<div class="card mb-2" style="border-left:4px solid ${c};${acted?'opacity:.55':''}">
    <div class="card-body py-2">
      <div class="d-flex align-items-center gap-2 mb-1">
        <span class="bot">🦺</span><b>SafetyCommander</b>
        <span class="badge" style="background:${c};color:#0b0e13">${esc(m.level).toUpperCase()}</span>
        <span class="text-secondary small ms-auto">${esc((m.ts||'').replace('T',' ').slice(0,16))}</span>
      </div>
      <div class="fw-bold">${esc(m.hazard)}</div>
      <div class="text-secondary obs2">${esc(m.observation)}</div>
      <div class="small mt-1" style="color:#a99bff">▸ ${esc(m.clause)}</div>
      <div class="mt-2">${actions}</div>
    </div></div>`;
}
function taskCard(t){
  const T=window.T||(k=>k), done=t.mine_state==='done';
  return `<div class="card mb-2" style="border-left:4px solid var(--tblr-primary);${done?'opacity:.55':''}">
    <div class="card-body py-2">
      <div class="d-flex align-items-center gap-2 mb-1">
        <span>📋</span><b>${esc(t.title)}</b>
        <span class="text-secondary small ms-auto">${T('w_due')}: ${esc(t.when)}</span>
      </div>
      <div class="text-secondary obs2">${esc(t.content)}</div>
      <div class="mt-2">${done?`<span class="badge bg-secondary">✓ ${T('w_donestate')}</span>`
        :`<button class="btn btn-sm btn-outline-primary" onclick="act('${t.id}','done')">${T('w_done')}</button>`}</div>
    </div></div>`;
}
function render(){
  const T=window.T||(k=>k);
  if(!_data) return;
  document.getElementById('alerts').innerHTML = _data.alerts.length
    ? _data.alerts.map(alertCard).join('') : `<div class="text-secondary py-2">${T('w_caughtup')}</div>`;
  document.getElementById('tasks').innerHTML = _data.tasks.length
    ? _data.tasks.map(taskCard).join('') : `<div class="text-secondary py-2">—</div>`;
  const u=_data.unread||0, ub=document.getElementById('unread');
  ub.textContent = u? (u+' '+T('w_unread')) : ''; ub.style.display = u? '' : 'none';
}
async function load(){ _data=await j('/api/inbox?worker='+encodeURIComponent(who())); render(); }
async function act(id,action){
  await fetch('/api/inbox/ack',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({worker:who(),id:id,action:action})});
  load();
}
async function initWho(){
  const ws=await j('/api/workers')||[], sel=document.getElementById('whoami');
  sel.innerHTML=ws.map(w=>`<option value="${w.id}">${w.icon} ${esc(w.name)} · ${esc(w.role)}</option>`).join('');
  const saved=localStorage.getItem('sc_worker');
  if(saved && ws.some(w=>w.id===saved)) sel.value=saved;
  sel.onchange=()=>{ localStorage.setItem('sc_worker',sel.value); load(); };
}
window.onLangChange=render;
(async()=>{ await initWho(); await load(); setInterval(load,3000); })();
</script>
</body>
</html>
