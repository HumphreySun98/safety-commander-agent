<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SafetyCommander · Worker</title>
<link rel="stylesheet" href="/static/vendor/tabler.min.css"/>
<style>
  :root{--tblr-font-sans-serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .status-hero{border-radius:14px;padding:22px 24px;color:#0b0e13;font-weight:700}
  .status-hero .lvl{font-size:13px;letter-spacing:1px;opacity:.85}
  .status-hero .hz{font-size:28px;font-weight:800;margin:4px 0}
  .alert-item{border-left:4px solid var(--tblr-orange)}
</style>
</head>
<body data-bs-theme="dark">
<header class="navbar navbar-expand-md d-print-none sticky-top">
  <div class="container-xl">
    <h1 class="navbar-brand fs-3 mb-0">👷 SafetyCommander · <span data-i18n="worker_title">Worker · Floor</span></h1>
    <div class="navbar-nav flex-row order-md-last align-items-center" style="gap:14px">
      <span id="langsw"></span>
      <a class="nav-link" href="/">← <span data-i18n="switch_view">switch view</span></a>
    </div>
  </div>
</header>
<div class="page-wrapper">
  <div class="page-body">
    <div class="container-xl" style="max-width:820px">

      <div class="status-hero mb-4" id="status" style="background:#6b7280">
        <div class="lvl">CURRENT FLOOR STATUS</div><div class="hz">—</div><div class="act small"></div>
      </div>

      <h3 class="text-secondary text-uppercase" data-i18n="alerts_h">⚠ Alerts to act on</h3>
      <div id="alerts" class="mb-4"><div class="text-secondary" data-i18n="loading">Loading…</div></div>

      <h3 class="text-secondary text-uppercase" data-i18n="tasks_h">📋 Your corrective tasks</h3>
      <div class="card mb-4"><div class="list-group list-group-flush" id="todo">
        <div class="list-group-item text-secondary" data-i18n="loading">Loading…</div></div></div>

      <h3 class="text-secondary text-uppercase" data-i18n="focus_h">📅 Today's focus</h3>
      <div class="card" style="border-color:var(--tblr-primary)"><div class="card-body" id="focus">
        <div class="text-secondary" data-i18n="loading">Loading…</div></div></div>

    </div>
  </div>
</div>
<script src="/static/vendor/tabler.min.js"></script>
<script src="/static/i18n.js"></script>
<script>
const C={none:'#6b7280',low:'#22c55e',medium:'#eab308',high:'#f97316',critical:'#ef4444'};
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function j(u){try{return await (await fetch(u)).json()}catch(e){return null}}
async function t(u){try{return await (await fetch(u)).text()}catch(e){return ''}}
let _state=null, _ca=null, _plan='';

function render(){
  const T=window.T||(k=>k);
  if(_state&&_state.latest){
    const v=_state.latest, lvl=String(v.risk_level||'none').toLowerCase(), c=C[lvl]||'#6b7280';
    const box=document.getElementById('status'); box.style.background=c;
    box.querySelector('.hz').textContent = lvl==='none'?T('all_clear'):esc(v.hazard_type);
    box.querySelector('.lvl').textContent = T('status_label')+' · '+(lvl==='none'?T('clear'):lvl.toUpperCase());
    box.querySelector('.act').textContent = lvl==='none'?'':(T('action_prefix')+' '+((v.recommended_actions||[])[0]||''));
    const evs=(_state.events||[]).filter(e=>['high','critical'].includes(String(e.judgment.risk_level).toLowerCase())).slice(-5).reverse();
    document.getElementById('alerts').innerHTML = evs.length? evs.map(e=>{
      const jd=e.judgment;return `<div class="card mb-2 alert-item" style="border-left-color:${C[jd.risk_level]||'#f97316'}">
        <div class="card-body py-2">
          <div class="fw-bold">${esc(jd.risk_level).toUpperCase()} · ${esc(jd.hazard_type)}</div>
          <div class="text-secondary">${esc(jd.observation)}</div>
          <div class="small mt-1" style="color:#a99bff">▸ ${esc(jd.policy_clause)}</div></div></div>`;
    }).join('') : `<div class="text-secondary">${T('no_alerts')}</div>`;
  }
  document.getElementById('todo').innerHTML = (_ca&&_ca.length)? _ca.slice(0,8).map(c=>
    `<label class="list-group-item d-flex align-items-start gap-2">
      <input class="form-check-input mt-1" type="checkbox">
      <span><b>${esc(c.hazard)}</b><div class="text-secondary small">${esc(c.instruction)}</div></span></label>`).join('')
    : `<div class="list-group-item text-secondary">${T('no_tasks')}</div>`;
  const focus=(_plan.match(/Focus this week:\*\*\s*(.+)/)||[])[1];
  const items=[...(_plan.matchAll(/^## (.+)$/gm))].slice(0,4).map(m=>m[1]);
  document.getElementById('focus').innerHTML = focus?
    (`<div class="fw-bold mb-1">${esc(focus)}</div>`+(items.length?'<ul class="mb-0">'+items.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>':''))
    : `<div class="text-secondary">${T('no_plan')}</div>`;
}
async function tick(){ _state=await j('/api/state'); _ca=await j('/api/correctives'); _plan=await t('/api/plan'); render(); }
window.onLangChange=render;
setInterval(tick,2500); tick();
</script>
</body>
</html>
